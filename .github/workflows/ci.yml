name: CI & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npmjs.org
        run: |
          package_name="$(node -p "require('./packages/ui/package.json').name")"
          package_version="$(node -p "require('./packages/ui/package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::${package_name}@${package_version} is already published; skipping duplicate publish."
            exit 0
          fi

          npm publish --workspace=packages/ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_API_KEY }}
