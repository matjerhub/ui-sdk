name: CI & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Configure runner cache
        run: |
          if [ -d /runner-cache ] && [ ! -w /runner-cache ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" /runner-cache 2>/dev/null || true
          fi
          if [ -d /runner-cache ] && [ -w /runner-cache ]; then
            CACHE_BASE="/runner-cache"
          else
            CACHE_BASE="${RUNNER_TEMP}/runner-cache"
          fi
          mkdir -p \
            "$CACHE_BASE/tool-cache" \
            "$CACHE_BASE/go-build" \
            "$CACHE_BASE/go-mod" \
            "$CACHE_BASE/npm" \
            "$CACHE_BASE/pnpm" \
            "$CACHE_BASE/yarn" \
            "$CACHE_BASE/bin"
          {
            echo "RUNNER_CACHE_DIR=$CACHE_BASE"
            echo "RUNNER_TOOL_CACHE=$CACHE_BASE/tool-cache"
            echo "GOCACHE=$CACHE_BASE/go-build"
            echo "GOMODCACHE=$CACHE_BASE/go-mod"
            echo "NPM_CONFIG_CACHE=$CACHE_BASE/npm"
            echo "PNPM_STORE_DIR=$CACHE_BASE/pnpm"
            echo "YARN_CACHE_FOLDER=$CACHE_BASE/yarn"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    concurrency:
      group: npm-publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Configure runner cache
        run: |
          if [ -d /runner-cache ] && [ ! -w /runner-cache ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" /runner-cache 2>/dev/null || true
          fi
          if [ -d /runner-cache ] && [ -w /runner-cache ]; then
            CACHE_BASE="/runner-cache"
          else
            CACHE_BASE="${RUNNER_TEMP}/runner-cache"
          fi
          mkdir -p \
            "$CACHE_BASE/tool-cache" \
            "$CACHE_BASE/go-build" \
            "$CACHE_BASE/go-mod" \
            "$CACHE_BASE/npm" \
            "$CACHE_BASE/pnpm" \
            "$CACHE_BASE/yarn" \
            "$CACHE_BASE/bin"
          {
            echo "RUNNER_CACHE_DIR=$CACHE_BASE"
            echo "RUNNER_TOOL_CACHE=$CACHE_BASE/tool-cache"
            echo "GOCACHE=$CACHE_BASE/go-build"
            echo "GOMODCACHE=$CACHE_BASE/go-mod"
            echo "NPM_CONFIG_CACHE=$CACHE_BASE/npm"
            echo "PNPM_STORE_DIR=$CACHE_BASE/pnpm"
            echo "YARN_CACHE_FOLDER=$CACHE_BASE/yarn"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npmjs.org
        run: |
          package_name="$(node -p "require('./packages/ui/package.json').name")"
          package_version="$(node -p "require('./packages/ui/package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::${package_name}@${package_version} is already published; skipping duplicate publish."
            exit 0
          fi

          npm publish --workspace=packages/ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_API_KEY }}
